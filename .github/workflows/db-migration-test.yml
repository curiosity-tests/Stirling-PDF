name: DB migration smoke test

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input, so racecar can trigger a run and
#      choose baseline vs instrumented. Upstream fires on push/PR, which racecar
#      cannot drive.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together. `chalk:` is the single variable separating
#      the two arms, and `profile:` selects the observables profile.
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block zeroes every unlisted scope, so the rest is restated.
#   4. A fail-closed assertion on the instrumented arm.
#   5. fail-fast: false on every matrix -- a measurement-integrity change, not a
#      build change: the instrumented arm has strictly more failure surface, so
#      fail-fast cancels its siblings more often than baseline's and biases the
#      comparison.
# Build and test COMMANDS are byte-identical to upstream.

# Boots the current Stirling-PDF JAR against H2 fixtures captured from past
# releases (v2.0.0 / v2.5.0 / v2.10.0) and verifies admin login still works.
# Catches schema changes that would break existing user databases under
# Hibernate's `ddl-auto=update` upgrade path.

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "run under chalk/curiosity; passed down by the calling workflow"
        type: boolean
        default: false
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar

permissions:
  contents: read
  id-token: write

env:
  # A called workflow cannot read the caller's env, so the arm switch has to
  # arrive as a workflow_call input.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  migration-test:
    environment:
      name: ci-unsigned
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c   # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # inert at action-checkout@main (not an input there); kept for forward-compat
        observables_continue_on_error: false
          # action-checkout defaults LFS on; actions/checkout does not
        lfs: false
    - name: Restore cache Gradle User Home
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk-25-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'buildSrc/**', 'settings.gradle', 'build.gradle', 'app/**/build.gradle', 'gradle/**/*.gradle') }}

    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5.7.0
      with:
        java-version: 25
        distribution: temurin

      # Keep the normal formatting path here so this smoke test exercises the
      # same Gradle configuration as the backend build.
    - name: Build Stirling-PDF JAR
      env:
        MAVEN_USER: ${{ secrets.MAVEN_USER }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        MAVEN_PUBLIC_URL: ${{ secrets.MAVEN_PUBLIC_URL }}
      run: ./gradlew :stirling-pdf:bootJar -PnoSpotless --no-daemon

    - name: Locate built JAR
      id: jar
      run: |
        jar=$(find app/core/build/libs -maxdepth 1 -name 'Stirling-PDF*.jar' -o -name 'stirling-pdf*.jar' 2>/dev/null \
            | grep -vE '(-plain|-sources)\.jar$' | head -n 1)
        if [[ -z "$jar" ]]; then
          echo "::error::No JAR under app/core/build/libs"
          ls -lah app/core/build/libs || true
          exit 1
        fi
        # Absolute path - the migration script pushd's into a temp workdir
        # before invoking java, which would dangle a relative path.
        jar=$(realpath "$jar")
        echo "path=$jar" >> "$GITHUB_OUTPUT"
        echo "Built JAR: $jar"

    - name: Run migration smoke test
      env:
        STIRLING_JAR: ${{ steps.jar.outputs.path }}
      run: bash scripts/db-migration/run-migration-test.sh

    - name: Upload app logs on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: db-migration-app-logs
          # Path matches the preserved workdir in run-migration-test.sh -
          # only failing fixtures leave a directory behind.
        path: /tmp/stirling-migration-failed-*/app.log
        retention-days: 7
        if-no-files-found: warn

    - name: Cleanup temporary files
      if: always()
      run: rm -rf /tmp/stirling-migration-failed-*
      continue-on-error: true
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
